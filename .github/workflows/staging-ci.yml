name: Staging CI matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Add to path
        run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: mulle-sde/github-ci@v2

      - name: Craft
        run: mulle-sde craft --release

      - name: Build and run demo
        run: |
          cd demo
          mulle-sde -DMULLE_CRAFT_PLATFORMS="${MULLE_UNAME}" \
                     -DMULLE_SOURCETREE_PLATFORMS="${MULLE_UNAME}" \
                     craft --debug
          exe="$(find kitchen -type f \( -name demo1 -o -name demo1.exe \) | head -1)"
          test -n "$exe"
          if command -v dsymutil > /dev/null 2>&1
          then
            dsymutil "$exe"
          fi
          "$exe" | tee demo.out
          grep -q "backend: backtrace" demo.out
          grep -q "foo at .*main-demo1[.]c:[0-9]" demo.out
          grep -q "main at .*main-demo1[.]c:[0-9]" demo.out

  windows-msys2:
    name: windows-latest (MSYS2 MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            curl
            tar
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Fetch test headers
        run: |
          deproot="$RUNNER_TEMP/ci-deps"
          depinclude="$(cygpath -m "$deproot/include")"
          rm -rf "$deproot" mulle-c11-latest
          mkdir -p "$deproot/include/mulle-c11" "$deproot/include/mulle-dlfcn"
          curl -fsSL https://github.com/mulle-c/mulle-c11/archive/latest.tar.gz | tar xz
          cp mulle-c11-latest/src/*.h "$deproot/include/mulle-c11/"
          printf '#ifndef MULLE_DLFCN_H\n#define MULLE_DLFCN_H\n#endif\n' \
            > "$deproot/include/mulle-dlfcn/mulle-dlfcn.h"
          rm -rf mulle-c11-latest
          echo "MULLE_DEPS_DIR=$depinclude" >> "$GITHUB_ENV"

      - name: Configure, build and run
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S .github/ci -B ci-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DMULLE_DEPS_DIR="$MULLE_DEPS_DIR"
          cmake --build ci-build
          ./ci-build/ci-demo | tee ci-demo.out
          grep -q "backend: backtrace" ci-demo.out
          grep -q "foo at .*demo[.]c:[0-9]" ci-demo.out
          grep -q "main at .*demo[.]c:[0-9]" ci-demo.out

  windows-msvc:
    name: windows-latest (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch test headers
        shell: bash
        run: |
          deproot="$RUNNER_TEMP/ci-deps"
          depinclude="$(cygpath -m "$deproot/include")"
          rm -rf "$deproot" mulle-c11-latest
          mkdir -p "$deproot/include/mulle-c11" "$deproot/include/mulle-dlfcn"
          curl -fsSL https://github.com/mulle-c/mulle-c11/archive/latest.tar.gz | tar xz
          cp mulle-c11-latest/src/*.h "$deproot/include/mulle-c11/"
          printf '#ifndef MULLE_DLFCN_H\n#define MULLE_DLFCN_H\n#endif\n' \
            > "$deproot/include/mulle-dlfcn/mulle-dlfcn.h"
          rm -rf mulle-c11-latest
          echo "MULLE_DEPS_DIR=$depinclude" >> "$GITHUB_ENV"

      - name: Configure, build and run
        shell: bash
        run: |
          cmake -S .github/ci -B ci-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=cl \
                -DMULLE_DEPS_DIR="$MULLE_DEPS_DIR"
          cmake --build ci-build
          ./ci-build/ci-demo.exe | tee ci-demo.out
          grep -q "backend: dbghelp" ci-demo.out
          grep -q "foo at .*demo[.]c:[0-9]" ci-demo.out
          grep -q "main at .*demo[.]c:[0-9]" ci-demo.out
